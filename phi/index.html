<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thanh toán QR - MB Bank</title>

<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QR MB Bank">
<link id="appleIcon" rel="apple-touch-icon">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #0b3d91 0%, #1565c0 50%, #1e88e5 100%);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
    margin: auto;
  }

  .body { padding: 24px 24px 26px; }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }

  .label-sub { font-weight: 500; font-size: 11.5px; color: #94a3b8; }

  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #dbe3ee;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: .2s;
    font-family: inherit;
    background: #fff;
  }
  .field input:focus {
    border-color: #1565c0;
    box-shadow: 0 0 0 3px rgba(21,101,192,.12);
  }

  #amount {
    font-size: 17px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: .3px;
  }

  .hint {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 6px;
    min-height: 16px;
    transition: .2s;
  }
  .hint.active { color: #1565c0; font-weight: 700; font-size: 13px; }

  .actions { display: flex; gap: 10px; margin: 18px 0 20px; }

  .btn {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
    font-family: inherit;
    text-align: center;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-primary {
    background: linear-gradient(135deg, #1565c0, #1e88e5);
    color: #fff;
    box-shadow: 0 6px 16px rgba(21,101,192,.32);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: translateY(1px); }

  .btn-outline {
    background: #fff;
    color: #1565c0;
    border: 1.5px solid #c9dcf5;
  }
  .btn-outline:hover { background: #f2f7fe; }

  .qr-box {
    background: #f7f9fc;
    border: 1px solid #e3e9f2;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
    position: relative;
    min-height: 200px;
    scroll-margin-top: 16px;
    transition: box-shadow .5s;
  }
  .qr-box.flash { box-shadow: 0 0 0 4px rgba(21,101,192,.35); }

  #qrImg {
    width: 100%;
    max-width: 300px;
    height: auto;
    border-radius: 8px;
    display: block;
    object-fit: contain;
  }

  .spinner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f9fc;
    border-radius: 16px;
    font-size: 13px;
    color: #64748b;
    text-align: center;
    padding: 20px;
  }
  .spinner.hide { display: none; }

  .note {
    text-align: center;
    font-size: 11.5px;
    color: #94a3b8;
    margin-top: 16px;
    line-height: 1.5;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #0f172a;
    color: #fff;
    padding: 11px 22px;
    border-radius: 30px;
    font-size: 13.5px;
    font-weight: 600;
    opacity: 0;
    transition: .3s;
    pointer-events: none;
    z-index: 999;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="card">
  <div class="body">

    <div class="field">
      <label for="amount">
        Số tiền <span class="label-sub">(nhập theo đơn vị nghìn đồng)</span>
      </label>
      <input id="amount" type="text" inputmode="numeric" autocomplete="off"
             placeholder="Ví dụ: 200 → 200.000 VNĐ">
      <div class="hint" id="amountHint">Nhập số tiền để mã QR có sẵn số tiền cần chuyển</div>
    </div>

    <div class="field">
      <label for="desc">Nội dung chuyển khoản</label>
      <input id="desc" type="text" autocomplete="off"
             placeholder="Ví dụ: Thanh toan don hang">
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btnCreate" onclick="buildQR(true)">Tạo mã QR</button>
      <button class="btn btn-outline" onclick="downloadQR()">Tải QR</button>
    </div>

    <div class="qr-box" id="qrBox">
      <div class="spinner" id="spinner">Đang tạo mã QR...</div>
      <img id="qrImg" alt="Mã QR thanh toán MB Bank" crossorigin="anonymous">
    </div>

    <p class="note">
      Quét mã bằng ứng dụng ngân hàng bất kỳ để chuyển khoản.<br>
      Vui lòng kiểm tra kỹ thông tin trước khi xác nhận.
    </p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CẤU HÌNH
   ============================================================ */
const CONFIG = {
  bankCode:    "MB",
  accountNo:   "0922332243",
  accountName: "Le Phi Phi",
  template:    "compact2"
};

const qrImg       = document.getElementById('qrImg');
const qrBox       = document.getElementById('qrBox');
const spinner     = document.getElementById('spinner');
const amountInput = document.getElementById('amount');
const amountHint  = document.getElementById('amountHint');
const descInput   = document.getElementById('desc');

/* ============================================================
   1. XỬ LÝ SỐ TIỀN
   ============================================================ */
let rawAmount = "";
let skipInput = false;

function formatVND(n) { return n.toLocaleString('vi-VN'); }

function renderAmount() {
  if (rawAmount) rawAmount = rawAmount.replace(/^0+(?=\d)/, '');

  if (!rawAmount) {
    amountInput.value = '';
    amountHint.textContent = 'Nhập số tiền để mã QR có sẵn số tiền cần chuyển';
    amountHint.classList.remove('active');
    return;
  }

  const value = Number(rawAmount) * 1000;
  amountInput.value = formatVND(value);
  amountHint.textContent = '= ' + formatVND(value) + ' VNĐ';
  amountHint.classList.add('active');
}

function getAmount() {
  return rawAmount ? String(Number(rawAmount) * 1000) : '';
}

amountInput.addEventListener('beforeinput', function (e) {
  const type = e.inputType;
  if (!type) return;

  const allSelected = amountInput.value.length > 0 &&
                      amountInput.selectionStart === 0 &&
                      amountInput.selectionEnd === amountInput.value.length;

  if (type === 'insertText' || type === 'insertFromPaste' ||
      type === 'insertFromDrop' || type === 'insertCompositionText') {

    let data = e.data;
    if (data == null && e.dataTransfer) data = e.dataTransfer.getData('text');
    if (data == null && e.clipboardData) data = e.clipboardData.getData('text');
    const digits = String(data || '').replace(/\D/g, '');

    if (allSelected) rawAmount = '';
    if (digits) rawAmount = (rawAmount + digits).slice(0, 15);

    e.preventDefault();
  }
  else if (type === 'deleteContentBackward' || type === 'deleteWordBackward') {
    rawAmount = allSelected ? '' : rawAmount.slice(0, -1);
    e.preventDefault();
  }
  else if (type === 'deleteContentForward') {
    rawAmount = allSelected ? '' : rawAmount.slice(1);
    e.preventDefault();
  }
  else if (type === 'deleteByCut' || type === 'deleteByDrag') {
    rawAmount = '';
    e.preventDefault();
  }
  else {
    return;
  }

  skipInput = true;
  setTimeout(() => { skipInput = false; }, 0);

  renderAmount();
  scheduleQR(false);
});

amountInput.addEventListener('input', function () {
  if (skipInput) return;
  let digits = amountInput.value.replace(/\D/g, '');
  if (digits.length > 3 && digits.slice(-3) === '000') {
    rawAmount = digits.slice(0, -3);
  } else {
    rawAmount = digits;
  }
  renderAmount();
  scheduleQR(false);
});

/* ============================================================
   2. TẠO MÃ QR
   ============================================================ */
function buildQRUrl(withCacheBuster) {
  const amount = getAmount();
  const desc   = descInput.value.trim();

  let url = `https://img.vietqr.io/image/${CONFIG.bankCode}-${CONFIG.accountNo}-${CONFIG.template}.png`;
  const params = [];

  if (amount)             params.push('amount='      + encodeURIComponent(amount));
  if (desc)               params.push('addInfo='     + encodeURIComponent(desc));
  if (CONFIG.accountName) params.push('accountName=' + encodeURIComponent(CONFIG.accountName));

  if (params.length) url += '?' + params.join('&');
  if (withCacheBuster) url += (url.includes('?') ? '&' : '?') + 't=' + Date.now();

  return url;
}

function scrollToQR() {
  const rect = qrBox.getBoundingClientRect();
  const fullyVisible = rect.top >= 0 && rect.bottom <= window.innerHeight;

  if (!fullyVisible) {
    qrBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  qrBox.classList.add('flash');
  setTimeout(() => qrBox.classList.remove('flash'), 900);
}

function buildQR(userAction) {
  spinner.classList.remove('hide');
  spinner.textContent = 'Đang tạo mã QR...';

  const url = buildQRUrl(true);
  const img = new Image();
  img.crossOrigin = 'anonymous';

  img.onload = function () {
    qrImg.src = url;
    spinner.classList.add('hide');

    if (userAction) {
      requestAnimationFrame(() => {
        setTimeout(scrollToQR, 60);
      });
    }
  };
  img.onerror = function () {
    spinner.classList.remove('hide');
    spinner.textContent = '⚠️ Không tải được mã QR. Vui lòng kiểm tra kết nối mạng.';
  };
  img.src = url;
}

let qrTimer;
function scheduleQR(userAction) {
  clearTimeout(qrTimer);
  qrTimer = setTimeout(() => buildQR(!!userAction), 450);
}

descInput.addEventListener('input', () => scheduleQR(false));

/* ============================================================
   3. TẢI MÃ QR — VẼ ẢNH RA CANVAS, XUẤT PNG
   Không dùng fetch/Blob/SVG → luôn ra .png, mở được ngay.
   ============================================================ */
function downloadQR() {
  if (!qrImg.src) {
    showToast('Vui lòng tạo mã QR trước');
    return;
  }

  const fileName = 'QR-MB-' + CONFIG.accountNo +
                   (getAmount() ? '-' + getAmount() : '') + '.png';

  const doExport = (sourceImg) => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width  = sourceImg.naturalWidth  || 600;
      canvas.height = sourceImg.naturalHeight || 600;

      const ctx = canvas.getContext('2d');
      // Nền trắng để chắc chắn ảnh PNG không trong suốt
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(sourceImg, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(function (blob) {
        if (!blob) { fallbackOpen(); return; }

        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = fileName;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 15000);

        showToast('Đã tải mã QR');
      }, 'image/png');
    } catch (e) {
      fallbackOpen();
    }
  };

  // Tải ảnh QR về với crossOrigin để canvas không bị "tainted"
  const tempImg = new Image();
  tempImg.crossOrigin = 'anonymous';
  tempImg.onload = function () { doExport(tempImg); };
  tempImg.onerror = function () { fallbackOpen(); };
  tempImg.src = buildQRUrl(false);

  function fallbackOpen() {
    showToast('Mở ảnh — nhấn giữ để lưu');
    window.open(buildQRUrl(false), '_blank', 'noopener');
  }
}

/* ============================================================
   4. TIỆN ÍCH
   ============================================================ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

document.querySelectorAll('input').forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); buildQR(true); }
  });
});

/* ============================================================
   5. ICON APPLE (tĩnh, không inject manifest/SW để tránh lỗi)
   ============================================================ */
(function setAppleIcon() {
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 192 192">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0b3d91"/>
          <stop offset="100%" stop-color="#1e88e5"/>
        </linearGradient>
      </defs>
      <rect width="192" height="192" rx="42" fill="url(#g)"/>
      <rect x="52" y="58" width="88" height="76" rx="10" fill="#fff" opacity=".95"/>
      <text x="96" y="110" font-family="Arial,Helvetica,sans-serif"
            font-size="44" font-weight="bold" fill="#0b3d91"
            text-anchor="middle">MB</text>
    </svg>`;
  document.getElementById('appleIcon').href =
    'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
})();

/* ============================================================
   6. KHỞI TẠO
   ============================================================ */
renderAmount();
buildQR(false);
</script>

</body>
</html>
