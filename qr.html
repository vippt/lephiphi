<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh Toán MB Bank</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      max-width: 480px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #f5f7fa;
    }
    h2 {
      text-align: center;
      color: #0052cc;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: 500;
    }
    input, button {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      background: #0052cc;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:hover {
      background: #0047b3;
    }
    .qr-container {
      margin-top: 1.5rem;
      text-align: center;
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: none;
    }
    #qr-amount {
      font-weight: bold;
      color: #d32f2f;
      font-size: 1.1rem;
      margin: 0.5rem 0;
    }
    canvas {
      max-width: 100%;
    }
  </style>
</head>
<body>

  <h2>💳 Thanh Toán MB Bank</h2>

  <div class="form-group">
    <label for="amount">Nhập số tiền</label>
    <input type="number" id="amount" placeholder="Ví dụ: 100 → thành 100000">
  </div>

  <div class="form-group">
    <label for="content">Nội dung chuyển khoản</label>
    <input type="text" id="content" placeholder="Nội dung (tùy chọn)">
  </div>

  <button onclick="taoQR()">Tạo QR</button>

  <div class="qr-container" id="qrBox">
    <h3>Mã QR sẽ hiển thị tại đây</h3>
    <p id="qr-amount"></p>
    <canvas id="qrcode"></canvas>
  </div>

<script>
// === THÔNG TIN TÀI KHOẢN ===
const BANK_BIN = "970422"; // MB Bank
const SO_TAI_KHOAN = "0922332243"; // ⚠️ SỬA SỐ TK CỦA BẠN Ở ĐÂY
const TEN_CHU_TK = "LE PHI PHI"; // Tên chủ tài khoản

function taoQR() {
  const amountInput = document.getElementById("amount").value.trim();
  const content = document.getElementById("content").value.trim();

  if (!amountInput) {
    alert("Vui lòng nhập số tiền!");
    return;
  }

  // ✅ THÊM 3 SỐ 0 VÀO CUỐI
  const amount = amountInput + "000"; // nhập 100 → 100000

  // Tạo dữ liệu chuẩn VietQR
  const qrData = buildVietQR(amount, content);

  // Hiển thị mã QR
  const qrBox = document.getElementById("qrBox");
  qrBox.style.display = "block";
  document.getElementById("qr-amount").innerText = 
    "Số tiền: " + new Intl.NumberFormat('vi-VN').format(amount) + " VNĐ";

  QRCode.toCanvas(document.getElementById("qrcode"), qrData, {
    width: 280,
    margin: 2,
    color: { dark: "#000", light: "#fff" }
  });
}

// Xây dựng chuỗi VietQR chuẩn
function buildVietQR(amount, desc) {
  const id = (k, v) => k + String(v.length).padStart(2, '0') + v;

  let data = "";
  data += id("00", "01"); // Phiên bản
  data += id("01", "11"); // Loại giao dịch
  data += id("38", 
    id("00", "A000000727") +
    id("01", id("00", BANK_BIN) + id("01", SO_TAI_KHOAN)) +
    id("02", "QRIBFTTA")
  );
  if (amount && amount !== "0") data += id("54", amount); // Số tiền
  data += id("58", "VN"); // Mã quốc gia
  if (TEN_CHU_TK) data += id("59", TEN_CHU_TK); // Tên chủ TK
  if (desc) data += id("62", id("08", desc)); // Nội dung

  // Tính checksum CRC16
  data += id("63", crc16(data).toString(16).toUpperCase().padStart(4, '0'));
  return data;
}

// Hàm tính CRC16 chuẩn VietQR
function crc16(str) {
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
      else crc <<= 1;
      crc &= 0xFFFF;
    }
  }
  return crc;
}
</script>
</body>
</html>
