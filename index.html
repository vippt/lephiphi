<!-- === NÚT & KHUNG CHAT BOT GÓC PHẢI === -->
<style>
/* Nút tròn nổi cố định góc phải dưới */
.chat-bot-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00ff41, #00cc34);
    box-shadow: 0 4px 20px rgba(0,255,65,0.4);
    cursor: pointer;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.chat-bot-toggle:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 25px rgba(0,255,65,0.5);
}
.chat-bot-toggle i {
    font-size: 26px;
    color: #000;
}

/* Khung cửa sổ chat */
.chat-bot-window {
    position: fixed;
    bottom: 95px;
    right: 24px;
    width: 380px;
    height: 520px;
    border-radius: 16px;
    box-shadow: 0 5px 30px rgba(0,0,0,0.25);
    background: #fff;
    z-index: 9998;
    overflow: hidden;
    transform: scale(0);
    transform-origin: bottom right;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    opacity: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
}
.chat-bot-window.open {
    transform: scale(1);
    opacity: 1;
    pointer-events: auto;
}

/* Thanh tiêu đề khung chat */
.chat-bot-header {
    background: linear-gradient(135deg, #00ff41, #00cc34);
    color: #000;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: bold;
    font-size: 15px;
}
.chat-bot-controls button {
    background: rgba(0,0,0,0.1);
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    margin-left: 6px;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #000;
}
.chat-bot-controls button:hover {
    background: rgba(0,0,0,0.2);
}

/* Nội dung iframe */
.chat-bot-iframe {
    flex: 1;
    border: none;
    width: 100%;
}

/* Tối ưu cho điện thoại */
@media (max-width: 480px) {
    .chat-bot-window {
        width: calc(100vw - 32px);
        height: 70vh;
        right: 16px;
        bottom: 90px;
    }
    .chat-bot-toggle {
        right: 16px;
        bottom: 16px;
    }
}
</style>

<!-- Nút mở/đóng Chat -->
<button class="chat-bot-toggle" id="chatBotToggle" title="Mở AI Chat">
    <i class="fa fa-commenting-o"></i>
</button>

<!-- Khung cửa sổ Chat Bot -->
<div class="chat-bot-window" id="chatBotWindow">
    <div class="chat-bot-header">
        🤖 AI Của Phi
        <div class="chat-bot-controls">
            <button id="chatMinimize" title="Thu nhỏ">−</button>
            <button id="chatClose" title="Đóng">×</button>
        </div>
    </div>
    <iframe 
        class="chat-bot-iframe" 
        id="chatBotFrame"
        src="http://lephiphi.com/chat-bot"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    ></iframe>
</div>

<script>
// === ĐIỀU KHIỂN MỞ/ĐÓNG KHUNG CHAT ===
const toggleBtn = document.getElementById('chatBotToggle');
const chatWindow = document.getElementById('chatBotWindow');
const chatMinimize = document.getElementById('chatMinimize');
const chatClose = document.getElementById('chatClose');
let isOpen = false;

// Mở khung chat
function openChat() {
    chatWindow.classList.add('open');
    isOpen = true;
}

// Đóng khung chat (thu nhỏ về nút)
function closeChat() {
    chatWindow.classList.remove('open');
    isOpen = false;
}

// Nhấn nút tròn → mở/đóng
toggleBtn.addEventListener('click', () => {
    if (isOpen) closeChat();
    else openChat();
});

// Nút thu nhỏ → đóng khung, giữ nút
chatMinimize.addEventListener('click', closeChat);

// Nút đóng → đóng khung
chatClose.addEventListener('click', closeChat);
</script>
<!-- === HẾT PHẦN CHAT BOT === -->
