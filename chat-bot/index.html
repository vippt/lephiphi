<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek — Chắc Chắn Chạy</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
        body{background:linear-gradient(135deg,#f0f4f8,#d9e2ec);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .chat{width:100%;max-width:420px;height:700px;background:#fff;border-radius:24px;box-shadow:0 12px 40px rgba(26,145,255,.15);display:flex;flex-direction:column;overflow:hidden}
        .hd{background:linear-gradient(90deg,#1a91ff,#00c6ff);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}
        .avt{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#1a91ff;font-weight:bold;font-size:20px}
        .hd-info{flex:1}
        .hd-info h3{font-size:16px}
        .msgs{flex:1;padding:20px;overflow-y:auto;background:#f8fafc;display:flex;flex-direction:column;gap:16px}
        .msg{max-width:78%}
        .bot{align-self:flex-start}
        .user{align-self:flex-end}
        .bubble{padding:14px 18px;border-radius:20px;line-height:1.6;white-space:pre-wrap}
        .bot .bubble{background:#fff;border:1px solid #e2e8f0;border-radius:20px 20px 20px 6px}
        .user .bubble{background:linear-gradient(90deg,#1a91ff,#00c6ff);color:#fff;border-radius:20px 20px 6px 20px}
        .time{font-size:10px;opacity:.6;margin-top:6px;text-align:right}
        .input-area{padding:18px 20px;background:#fff;border-top:1px solid #e2e8f0;display:flex;gap:10px}
        #inp{flex:1;padding:14px 20px;border:1px solid #e2e8f0;border-radius:25px;outline:none;font-size:15px}
        #inp:focus{border-color:#1a91ff;box-shadow:0 0 0 3px rgba(26,145,255,.1)}
        .send{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(90deg,#1a91ff,#00c6ff);color:#fff;cursor:pointer;font-size:18px}
        .send:disabled{opacity:.5;cursor:not-allowed}
        .typing{display:flex;gap:4px;padding:14px 18px}
        .dot{width:8px;height:8px;background:#cbd5e1;border-radius:50%;animation:typing 1.4s infinite}
        .dot:nth-child(2){animation-delay:.2s}
        .dot:nth-child(3){animation-delay:.4s}
        @keyframes typing{0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)}}
    </style>
</head>
<body>
    <div class="chat">
        <div class="hd">
            <div class="avt">🧠</div>
            <div class="hd-info"><h3>DeepSeek AI</h3></div>
        </div>
        <div class="msgs" id="msgs">
            <div class="msg bot"><div class="bubble">Sẵn sàng! 😊 Hãy hỏi tôi nhé!</div></div>
        </div>
        <div class="input-area">
            <input type="text" id="inp" placeholder="Nhập tin nhắn..." autocomplete="off">
            <button class="send" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        // =============================================
        // === DÁN URL GOOGLE SCRIPT CỦA BẠN VÀO ĐÂY ===
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzb_Uu_F4zqAWHk0e8o31yqJ9QQ4EOM295qKUiKPhmCFKZ8LCAfi6oGs8LFB1dGiTUH/exec";
        // =============================================

        const msgsBox = document.getElementById('msgs');
        const inputBox = document.getElementById('inp');
        const sendBtn = document.getElementById('sendBtn');
        let history = [];

        // === CHUYỂN MỌI THÀNH CHUỖI — KHÔNG BAO GIỜ [object Object] ===
        function asString(giTri) {
            if (giTri === null || giTri === undefined) return "";
            if (typeof giTri === 'string') return giTri;
            if (typeof giTri === 'object') {
                if (giTri.message && typeof giTri.message === 'string') return giTri.message;
                try { return JSON.stringify(giTri); }
                catch { return "Đối tượng không hiển thị được"; }
            }
            return String(giTri);
        }

        function themTin(noiDung, laNguoiDung) {
            const text = asString(noiDung) || "Nội dung trống";
            const gio = new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
            const div = document.createElement('div');
            div.className = `msg ${laNguoiDung ? 'user' : 'bot'}`;
            div.innerHTML = `<div class="bubble">${text.replace(/\n/g,'<br>')}<div class="time">${gio}</div></div>`;
            msgsBox.appendChild(div);
            msgsBox.scrollTop = msgsBox.scrollHeight;
        }

        function hienDangXuLy() {
            const div = document.createElement('div');
            div.className = 'msg bot'; div.id = 'dangxuly';
            div.innerHTML = `<div class="bubble typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            msgsBox.appendChild(div);
            msgsBox.scrollTop = msgsBox.scrollHeight;
        }
        function anDangXuLy() {
            const el = document.getElementById('dangxuly');
            if (el) el.remove();
        }

        async function guiTin() {
            const cauHoi = inputBox.value.trim();
            if (!cauHoi) return;
            
            if (SCRIPT_URL.indexOf("THAY_URL") !== -1) {
                alert("⚠️ Chưa điền URL Google Script!\nMở file HTML → dán URL vào chỗ THAY_URL_CUA_BAN");
                return;
            }

            // Hiển thị tin nhắn ngay
            themTin(cauHoi, true);
            inputBox.value = "";
            sendBtn.disabled = true;
            
            history.push({role:'user', content:cauHoi});
            hienDangXuLy();

            try {
                const formData = new FormData();
                formData.append("data", JSON.stringify({
                    messages: [
                        {role:'system', content:'Trả lời bằng tiếng Việt, ngắn gọn, dễ hiểu.'},
                        ...history
                    ]
                }));

                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    throw new Error(`Lỗi kết nối: ${res.status}`);
                }

                const textTraVe = await res.text();
                let json;
                try {
                    json = JSON.parse(textTraVe);
                } catch (parseErr) {
                    throw new Error(`Phản hồi không phải JSON: ${textTraVe.substring(0, 80)}`);
                }

                if (json.error !== undefined) {
                    throw new Error(asString(json.error));
                }

                if (!json.choices || !json.choices[0] || !json.choices[0].message) {
                    throw new Error("API không trả về định dạng mong đợi");
                }

                const cauTraLoi = asString(json.choices[0].message.content);
                history.push({role:'assistant', content:cauTraLoi});
                anDangXuLy();
                themTin(cauTraLoi, false);

            } catch (e) {
                anDangXuLy();
                const thongBao = asString(e);
                themTin(`❌ Lỗi: ${thongBao}`, false);
                console.error("Chi tiết lỗi đầy đủ:", e);
            }

            sendBtn.disabled = false;
            inputBox.focus();
        }

        sendBtn.addEventListener('click', guiTin);
        inputBox.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                guiTin();
            }
        });
    </script>
</body>
</html>
