<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek — Chạy Ngay</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
        body{background:linear-gradient(135deg,#f0f4f8,#d9e2ec);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .chat{width:100%;max-width:420px;height:700px;background:#fff;border-radius:24px;box-shadow:0 12px 40px rgba(26,145,255,.15);display:flex;flex-direction:column;overflow:hidden}
        .hd{background:linear-gradient(90deg,#1a91ff,#00c6ff);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}
        .avt{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#1a91ff;font-weight:bold;font-size:20px}
        .hd-info{flex:1}
        .hd-info h3{font-size:16px}
        .msgs{flex:1;padding:20px;overflow-y:auto;background:#f8fafc;display:flex;flex-direction:column;gap:16px}
        .msg{max-width:78%}
        .bot{align-self:flex-start}
        .user{align-self:flex-end}
        .bubble{padding:14px 18px;border-radius:20px;line-height:1.6;white-space:pre-wrap}
        .bot .bubble{background:#fff;border:1px solid #e2e8f0;border-radius:20px 20px 20px 6px}
        .user .bubble{background:linear-gradient(90deg,#1a91ff,#00c6ff);color:#fff;border-radius:20px 20px 6px 20px}
        .time{font-size:10px;opacity:.6;margin-top:6px;text-align:right}
        .input-area{padding:18px 20px;background:#fff;border-top:1px solid #e2e8f0;display:flex;gap:10px}
        #inp{flex:1;padding:14px 20px;border:1px solid #e2e8f0;border-radius:25px;outline:none;font-size:15px}
        .send{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(90deg,#1a91ff,#00c6ff);color:#fff;cursor:pointer}
        .send:disabled{opacity:.5}
        .typing{display:flex;gap:4px;padding:14px 18px}
        .dot{width:8px;height:8px;background:#cbd5e1;border-radius:50%;animation:typing 1.4s infinite}
        .dot:nth-child(2){animation-delay:.2s}
        .dot:nth-child(3){animation-delay:.4s}
        @keyframes typing{0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)}}
    </style>
</head>
<body>
    <div class="chat">
        <div class="hd">
            <div class="avt">🧠</div>
            <div class="hd-info"><h3>DeepSeek AI</h3></div>
        </div>
        <div class="msgs" id="msgs">
            <div class="msg bot"><div class="bubble">Sẵn sàng! 😊 Hãy hỏi tôi nhé!</div></div>
        </div>
        <div class="input-area">
            <input type="text" id="inp" placeholder="Nhập câu hỏi...">
            <button class="send" id="send">➤</button>
        </div>
    </div>

    <script>
        // === DÁN URL GOOGLE SCRIPT CỦA BẠN VÀO DƯỚI ===
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxNpq0HiyssNxk0PWBAYItJ-X1ygzzziEzVN0lwpUL6_5wZOCtoSMKNTxVvbS5EcPLA/exec";
        // =============================================

        const msgs = document.getElementById('msgs');
        const inp = document.getElementById('inp');
        const sendBtn = document.getElementById('send');
        let history = [];

        function addMsg(text, isUser=false) {
            const t = String(text || ""); // LUÔN là chuỗi ✅
            const time = new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
            const div = document.createElement('div');
            div.className = `msg ${isUser?'user':'bot'}`;
            div.innerHTML = `<div class="bubble">${t.replace(/\n/g,'<br>')}<div class="time">${time}</div></div>`;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function showTyping() {
            const d = document.createElement('div');
            d.className = 'msg bot'; d.id = 'typing';
            d.innerHTML = `<div class="bubble typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
        }
        function hideTyping() { document.getElementById('typing')?.remove(); }

        async function go() {
            const text = inp.value.trim();
            if (!text) return;
            if (SCRIPT_URL.includes("THAY_BANG")) {
                alert("⚠️ Dán URL Google Script vào chỗ SCRIPT_URL!");
                return;
            }
            
            addMsg(text, true);
            inp.value = '';
            history.push({role:'user', content:text});
            
            showTyping();
            sendBtn.disabled = true;

            try {
                const fd = new FormData();
                fd.append("data", JSON.stringify({
                    messages: [
                        {role:'system', content:'Trả lời bằng tiếng Việt, ngắn gọn, dễ hiểu.'},
                        ...history
                    ]
                }));

                const res = await fetch(SCRIPT_URL, {method:'POST', body:fd});
                const txt = await res.text();
                let data;
                try { data = JSON.parse(txt); }
                catch { throw new Error(`Phản hồi không phải JSON: ${txt.slice(0,80)}`); }

                if (data.error) throw new Error(data.error);
                if (!data.choices?.[0]?.message?.content) throw new Error("API không trả về kết quả");

                const reply = data.choices[0].message.content;
                history.push({role:'assistant', content:reply});
                hideTyping();
                addMsg(reply);
                
            } catch (e) {
                hideTyping();
                // === SỬA GỐC: Lấy đúng message ===
                const loi = e?.message || String(e) || "Lỗi không xác định";
                addMsg(`❌ Lỗi: ${loi}`);
                console.error("Lỗi:", e);
            }
            
            sendBtn.disabled = false;
        }

        sendBtn.onclick = go;
        inp.onkeypress = e => e.key === 'Enter' && go();
    </script>
</body>
</html>
