<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thanh toán QR - MB Bank</title>

<!-- ===== PWA META ===== -->
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QR MB Bank">
<link id="appleIcon" rel="apple-touch-icon">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #0b3d91 0%, #1565c0 50%, #1e88e5 100%);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
    margin: auto;
  }

  .header {
    background: linear-gradient(135deg, #0b3d91, #1565c0);
    color: #fff;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 46px; height: 46px;
    background: #fff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #0b3d91;
    font-size: 15px;
    letter-spacing: -.5px;
    flex-shrink: 0;
  }

  .header h1 { font-size: 17px; font-weight: 700; }
  .header p  { font-size: 12.5px; opacity: .85; margin-top: 2px; }

  .body { padding: 22px 24px 26px; }

  /* ---------- Ô nhập liệu ---------- */
  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }

  .label-sub {
    font-weight: 500;
    font-size: 11.5px;
    color: #94a3b8;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #dbe3ee;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: .2s;
    font-family: inherit;
    background: #fff;
  }
  .field input:focus {
    border-color: #1565c0;
    box-shadow: 0 0 0 3px rgba(21,101,192,.12);
  }

  #amount {
    font-size: 17px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: .3px;
  }

  .hint {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 6px;
    min-height: 16px;
    transition: .2s;
  }
  .hint.active {
    color: #1565c0;
    font-weight: 700;
    font-size: 13px;
  }

  /* ---------- Nút ---------- */
  .actions { display: flex; gap: 10px; margin: 18px 0 20px; }

  .btn {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
    font-family: inherit;
    text-align: center;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-primary {
    background: linear-gradient(135deg, #1565c0, #1e88e5);
    color: #fff;
    box-shadow: 0 6px 16px rgba(21,101,192,.32);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: translateY(1px); }

  .btn-outline {
    background: #fff;
    color: #1565c0;
    border: 1.5px solid #c9dcf5;
  }
  .btn-outline:hover { background: #f2f7fe; }

  /* ---------- QR ---------- */
  .qr-box {
    background: #f7f9fc;
    border: 1px solid #e3e9f2;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
    position: relative;
    min-height: 200px;
    scroll-margin-top: 16px;
    transition: box-shadow .5s;
  }

  .qr-box.flash {
    box-shadow: 0 0 0 4px rgba(21,101,192,.35);
  }

  #qrImg {
    width: 100%;
    max-width: 300px;
    height: auto;
    border-radius: 8px;
    display: block;
    object-fit: contain;
  }

  .spinner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f9fc;
    border-radius: 16px;
    font-size: 13px;
    color: #64748b;
    text-align: center;
    padding: 20px;
  }
  .spinner.hide { display: none; }

  /* ---------- Thông tin ngân hàng ---------- */
  .bank-info {
    background: #f7f9fc;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 14px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
  }
  .row + .row { border-top: 1px dashed #dfe6f0; }

  .row .label { color: #64748b; font-size: 13px; }
  .row .value { font-weight: 700; color: #0f172a; text-align: right; }

  .copy-btn {
    background: #e8f0fe;
    color: #1565c0;
    border: none;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 8px;
    transition: .2s;
    font-family: inherit;
  }
  .copy-btn:hover { background: #d3e2fb; }
  .copy-btn:active { transform: scale(.95); }

  .note {
    text-align: center;
    font-size: 11.5px;
    color: #94a3b8;
    margin-top: 16px;
    line-height: 1.5;
  }

  /* ---------- Nút "Thêm vào màn hình chính" ---------- */
  .install-wrap {
    margin-top: 18px;
    display: none;
  }
  .install-wrap.show { display: block; }

  .btn-install {
    width: 100%;
    padding: 14px;
    border: 1.5px dashed #1565c0;
    border-radius: 14px;
    background: #f2f7fe;
    color: #1565c0;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: .2s;
  }
  .btn-install:hover { background: #e3eefc; }
  .btn-install:active { transform: scale(.98); }

  .btn-install svg {
    width: 20px; height: 20px; flex-shrink: 0;
  }

  .install-note {
    display: none;
    margin-top: 10px;
    padding: 12px 14px;
    background: #fff8e6;
    border: 1px solid #f5dfa6;
    border-radius: 12px;
    font-size: 12.5px;
    color: #7a5c00;
    line-height: 1.55;
  }
  .install-note.show { display: block; }
  .install-note b { color: #5c4500; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #0f172a;
    color: #fff;
    padding: 11px 22px;
    border-radius: 30px;
    font-size: 13.5px;
    font-weight: 600;
    opacity: 0;
    transition: .3s;
    pointer-events: none;
    z-index: 999;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="logo">MB</div>
    <div>
      <h1>Thanh toán bằng QR</h1>
      <p>Ngân hàng TMCP Quân Đội (MB Bank)</p>
    </div>
  </div>

  <div class="body">

    <!-- ===== NHẬP TIỀN & NỘI DUNG ===== -->
    <div class="field">
      <label for="amount">
        Số tiền <span class="label-sub">(nhập theo đơn vị nghìn đồng)</span>
      </label>
      <input id="amount" type="text" inputmode="numeric" autocomplete="off"
             placeholder="Ví dụ: 200 → 200.000 VNĐ">
      <div class="hint" id="amountHint">Nhập số tiền để mã QR có sẵn số tiền cần chuyển</div>
    </div>

    <div class="field">
      <label for="desc">Nội dung chuyển khoản</label>
      <input id="desc" type="text" autocomplete="off"
             placeholder="Ví dụ: Thanh toan don hang">
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btnCreate" onclick="buildQR(true)">Tạo mã QR</button>
      <button class="btn btn-outline" onclick="downloadQR()">Tải QR</button>
    </div>

    <!-- ===== MÃ QR ===== -->
    <div class="qr-box" id="qrBox">
      <div class="spinner" id="spinner">Đang tạo mã QR...</div>
      <img id="qrImg" alt="Mã QR thanh toán MB Bank">
    </div>

    <!-- ===== THÔNG TIN TÀI KHOẢN ===== -->
    <div class="bank-info">
      <div class="row">
        <span class="label">Ngân hàng</span>
        <span class="value">MB Bank</span>
      </div>
      <div class="row">
        <span class="label">Số tài khoản</span>
        <span class="value">
          0922332243
          <button class="copy-btn" onclick="copyText('0922332243','Đã copy số tài khoản')">Copy</button>
        </span>
      </div>
      <div class="row">
        <span class="label">Chủ tài khoản</span>
        <span class="value" id="ownerName">—</span>
      </div>
    </div>

    <!-- ===== THÊM VÀO MÀN HÌNH CHÍNH ===== -->
    <div class="install-wrap" id="installWrap">
      <button class="btn-install" id="btnInstall" onclick="installApp()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"></path>
          <path d="M8 11l4 4 4-4"></path>
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
        </svg>
        Thêm vào màn hình chính
      </button>
      <div class="install-note" id="installNote"></div>
    </div>

    <p class="note">
      Quét mã bằng ứng dụng ngân hàng bất kỳ để chuyển khoản.<br>
      Vui lòng kiểm tra kỹ thông tin trước khi xác nhận.
    </p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CẤU HÌNH — chỉnh sửa tại đây
   ============================================================ */
const CONFIG = {
  bankCode:    "MB",              // Mã ngân hàng MB Bank (VietQR)
  accountNo:   "0922332243",      // Số tài khoản
  accountName: "",                // Tên chủ tài khoản (không dấu, IN HOA)
  template:    "compact2",        // compact | compact2 | qr_only | print
  appName:     "QR MB Bank"       // Tên hiển thị khi cài ra màn hình chính
};
/* ============================================================ */

const qrImg       = document.getElementById('qrImg');
const qrBox       = document.getElementById('qrBox');
const spinner     = document.getElementById('spinner');
const amountInput = document.getElementById('amount');
const amountHint  = document.getElementById('amountHint');
const descInput   = document.getElementById('desc');

document.getElementById('ownerName').textContent =
  CONFIG.accountName ? CONFIG.accountName : '—';

/* ============================================================
   1. XỬ LÝ SỐ TIỀN: nhập 200  ->  200.000
   ============================================================ */
let rawAmount = "";
let skipInput = false;

function formatVND(n) { return n.toLocaleString('vi-VN'); }

function renderAmount() {
  if (rawAmount) rawAmount = rawAmount.replace(/^0+(?=\d)/, '');

  if (!rawAmount) {
    amountInput.value = '';
    amountHint.textContent = 'Nhập số tiền để mã QR có sẵn số tiền cần chuyển';
    amountHint.classList.remove('active');
    return;
  }

  const value = Number(rawAmount) * 1000;   // ⬅️ TỰ THÊM 3 SỐ 0
  amountInput.value = formatVND(value);
  amountHint.textContent = '= ' + formatVND(value) + ' VNĐ';
  amountHint.classList.add('active');
}

function getAmount() {
  return rawAmount ? String(Number(rawAmount) * 1000) : '';
}

amountInput.addEventListener('beforeinput', function (e) {
  const type = e.inputType;
  if (!type) return;

  const allSelected = amountInput.value.length > 0 &&
                      amountInput.selectionStart === 0 &&
                      amountInput.selectionEnd === amountInput.value.length;

  if (type === 'insertText' || type === 'insertFromPaste' ||
      type === 'insertFromDrop' || type === 'insertCompositionText') {

    let data = e.data;
    if (data == null && e.dataTransfer) data = e.dataTransfer.getData('text');
    if (data == null && e.clipboardData) data = e.clipboardData.getData('text');
    const digits = String(data || '').replace(/\D/g, '');

    if (allSelected) rawAmount = '';
    if (digits) rawAmount = (rawAmount + digits).slice(0, 15);

    e.preventDefault();
  }
  else if (type === 'deleteContentBackward' || type === 'deleteWordBackward') {
    rawAmount = allSelected ? '' : rawAmount.slice(0, -1);
    e.preventDefault();
  }
  else if (type === 'deleteContentForward') {
    rawAmount = allSelected ? '' : rawAmount.slice(1);
    e.preventDefault();
  }
  else if (type === 'deleteByCut' || type === 'deleteByDrag') {
    rawAmount = '';
    e.preventDefault();
  }
  else {
    return;
  }

  skipInput = true;
  setTimeout(() => { skipInput = false; }, 0);

  renderAmount();
  scheduleQR(false);
});

amountInput.addEventListener('input', function () {
  if (skipInput) return;
  let digits = amountInput.value.replace(/\D/g, '');
  if (digits.length > 3 && digits.slice(-3) === '000') {
    rawAmount = digits.slice(0, -3);
  } else {
    rawAmount = digits;
  }
  renderAmount();
  scheduleQR(false);
});

/* ============================================================
   2. TẠO MÃ QR + TỰ ĐỘNG TRƯỢT XUỐNG
   ============================================================ */
function buildQRUrl(withCacheBuster) {
  const amount = getAmount();
  const desc   = descInput.value.trim();

  let url = `https://img.vietqr.io/image/${CONFIG.bankCode}-${CONFIG.accountNo}-${CONFIG.template}.png`;
  const params = [];

  if (amount)             params.push('amount='      + encodeURIComponent(amount));
  if (desc)               params.push('addInfo='     + encodeURIComponent(desc));
  if (CONFIG.accountName) params.push('accountName=' + encodeURIComponent(CONFIG.accountName));

  if (params.length) url += '?' + params.join('&');
  if (withCacheBuster) url += (url.includes('?') ? '&' : '?') + 't=' + Date.now();

  return url;
}

/* Tự động cuộn xuống khung QR mượt mà */
function scrollToQR() {
  const rect = qrBox.getBoundingClientRect();
  const fullyVisible = rect.top >= 0 && rect.bottom <= window.innerHeight;

  if (!fullyVisible) {
    qrBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // Nhấp nháy viền để người dùng biết QR vừa được cập nhật
  qrBox.classList.add('flash');
  setTimeout(() => qrBox.classList.remove('flash'), 900);
}

/**
 * @param {boolean} userAction - true khi người dùng bấm nút "Tạo mã QR"
 *                               (sẽ tự cuộn xuống), false khi tự động cập nhật.
 */
function buildQR(userAction) {
  spinner.classList.remove('hide');
  spinner.textContent = 'Đang tạo mã QR...';

  const url = buildQRUrl(true);
  const img = new Image();

  img.onload = function () {
    qrImg.src = url;
    spinner.classList.add('hide');

    // ⬇️ TỰ ĐỘNG TRƯỢT XUỐNG KHI BẤM NÚT
    if (userAction) {
      // đợi 1 nhịp để ảnh render xong rồi mới cuộn
      requestAnimationFrame(() => {
        setTimeout(scrollToQR, 60);
      });
    }
  };
  img.onerror = function () {
    spinner.classList.remove('hide');
    spinner.textContent = '⚠️ Không tải được mã QR. Vui lòng kiểm tra kết nối mạng.';
  };
  img.src = url;
}

/* Tự động cập nhật QR khi ngừng gõ (không cuộn trang) */
let qrTimer;
function scheduleQR(userAction) {
  clearTimeout(qrTimer);
  qrTimer = setTimeout(() => buildQR(!!userAction), 450);
}

descInput.addEventListener('input', () => scheduleQR(false));

/* ============================================================
   3. TẢI MÃ QR
   ============================================================ */
function downloadQR() {
  const url = buildQRUrl(false);

  fetch(url)
    .then(r => {
      if (!r.ok) throw new Error('network');
      return r.blob();
    })
    .then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'QR-MB-' + CONFIG.accountNo +
                   (getAmount() ? '-' + getAmount() : '') + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
      showToast('Đã tải mã QR');
    })
    .catch(() => showToast('Không tải được, vui lòng thử lại'));
}

/* ============================================================
   4. TIỆN ÍCH
   ============================================================ */
function copyText(text, msg) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => showToast(msg));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(msg);
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

document.querySelectorAll('input').forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); buildQR(true); }
  });
});

/* ============================================================
   5. PWA — THÊM VÀO MÀN HÌNH CHÍNH
   ============================================================ */

/* --- 5.1 Tạo icon động (SVG -> PNG data URL) --- */
function makeIcon(size) {
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 192 192">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0b3d91"/>
          <stop offset="100%" stop-color="#1e88e5"/>
        </linearGradient>
      </defs>
      <rect width="192" height="192" rx="42" fill="url(#g)"/>
      <rect x="52" y="58" width="88" height="76" rx="10" fill="#fff" opacity=".95"/>
      <text x="96" y="110" font-family="Arial,Helvetica,sans-serif"
            font-size="44" font-weight="bold" fill="#0b3d91"
            text-anchor="middle">MB</text>
    </svg>`;
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

/* --- 5.2 Nhúng manifest động --- */
function injectManifest() {
  const manifest = {
    name: CONFIG.appName + " - Thanh toán",
    short_name: CONFIG.appName,
    description: "Tạo mã QR thanh toán MB Bank " + CONFIG.accountNo,
    start_url: location.href.split('#')[0],
    scope: "./",
    display: "standalone",
    orientation: "portrait",
    background_color: "#0b3d91",
    theme_color: "#0b3d91",
    lang: "vi",
    icons: [
      { src: makeIcon(192), sizes: "192x192", type: "image/svg+xml", purpose: "any" },
      { src: makeIcon(512), sizes: "512x512", type: "image/svg+xml", purpose: "any" },
      { src: makeIcon(512), sizes: "512x512", type: "image/svg+xml", purpose: "maskable" }
    ]
  };

  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);

  // Icon cho iOS
  document.getElementById('appleIcon').href = makeIcon(180);
}

/* --- 5.3 Service Worker tối giản (bắt buộc để cài PWA) --- */
function injectServiceWorker() {
  if (!('serviceWorker' in navigator)) return;

  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      e.respondWith(
        fetch(e.request).catch(() => caches.match(e.request))
      );
    });
  `;

  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);

  navigator.serviceWorker.register(swUrl).catch(() => {
    /* Bỏ qua nếu môi trường không hỗ trợ (file:// hoặc http) */
  });
}

/* --- 5.4 Logic nút "Thêm vào màn hình chính" --- */
let deferredPrompt = null;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone === true;
}

function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function showInstallUI() {
  const wrap = document.getElementById('installWrap');
  if (isStandalone()) return;   // đã cài rồi thì ẩn
  wrap.classList.add('show');
}

function installApp() {
  const note = document.getElementById('installNote');

  // Android / Chrome / Edge: có sự kiện cài đặt gốc
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choice => {
      if (choice.outcome === 'accepted') {
        showToast('Đang thêm vào màn hình chính...');
      } else {
        showToast('Bạn đã hủy cài đặt');
      }
      deferredPrompt = null;
      document.getElementById('installWrap').classList.remove('show');
    });
    return;
  }

  // iOS Safari: hướng dẫn thủ công
  if (isIOS()) {
    note.innerHTML =
      '<b>Trên iPhone / iPad (Safari):</b><br>' +
      '1. Nhấn nút <b>Chia sẻ</b> (hình vuông có mũi tên ↑) ở thanh dưới.<br>' +
      '2. Cuộn xuống và chọn <b>Thêm vào màn hình chính</b>.<br>' +
      '3. Nhấn <b>Thêm</b> để hoàn tất.';
    note.classList.toggle('show');
    return;
  }

  // Trình duyệt khác (Firefox, Safari desktop...)
  note.innerHTML =
    '<b>Trình duyệt của bạn chưa hỗ trợ cài trực tiếp.</b><br>' +
    'Hãy mở trang này bằng <b>Chrome</b> (Android) hoặc <b>Safari</b> (iPhone), ' +
    'rồi chọn <b>Thêm vào màn hình chính</b> trong menu trình duyệt.';
  note.classList.toggle('show');
}

/* Bắt sự kiện cài đặt gốc */
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallUI();
});

/* Ẩn nút sau khi cài xong */
window.addEventListener('appinstalled', () => {
  document.getElementById('installWrap').classList.remove('show');
  showToast('Đã thêm vào màn hình chính');
});

/* ============================================================
   6. KHỞI TẠO
   ============================================================ */
injectManifest();
injectServiceWorker();
renderAmount();
buildQR(false);

// Hiện nút cài đặt nếu trình duyệt hỗ trợ hoặc là iOS
if (!isStandalone() && (isIOS() || window.matchMedia('(display-mode: browser)').matches)) {
  // Với iOS hiện ngay, với Android chờ beforeinstallprompt (đã bắt ở trên)
  if (isIOS()) showInstallUI();
  else setTimeout(() => {
    if (deferredPrompt) showInstallUI();
  }, 1200);
}
</script>
